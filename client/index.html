<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلوت</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a1f0f 0%, #1a5f2a 100%);
            color: #f0f0f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .logo { font-size: 4rem; margin-bottom: 1rem; }
        h1 { font-size: 3rem; color: #d4af37; margin-bottom: 0.5rem; }
        .subtitle { color: #888; margin-bottom: 2rem; }
        .btn {
            padding: 1rem 2rem;
            margin: 0.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2d8b3e, #1a5f2a);
            color: white;
        }
        .btn:hover { transform: translateY(-2px); }
        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .connected { color: #27ae60; }
        .disconnected { color: #c0392b; }
    </style>
</head>
<body>
    <div class="logo">🃏</div>
    <h1>بلوت</h1>
    <p class="subtitle">لعبة كملنا الرقمية</p>
    
    <div>
        <button class="btn btn-primary" onclick="startGame()">🎮 لعب فردي</button>
        <button class="btn btn-primary" onclick="joinGame()">🌐 لعب جماعي</button>
    </div>
    
    <div class="status" id="status">
        جاري الاتصال بالخادم...
    </div>

    <script>
        const ws = new WebSocket('wss://' + window.location.host);
        
        ws.onopen = () => {
            document.getElementById('status').innerHTML = '<span class="connected">✅ متصل</span>';
            ws.send(JSON.stringify({type: 'CREATE_ROOM'}));
        };
        
        ws.onclose = () => {
            document.getElementById('status').innerHTML = '<span class="disconnected">❌ غير متصل</span>';
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log('Received:', data);
        };
        
        function startGame() {
            alert('جاري التحميل...');
        }
        
        function joinGame() {
            const roomId = prompt('أدخل رمز الغرفة:');
            if (roomId) {
                ws.send(JSON.stringify({type: 'JOIN_ROOM', roomId}));
            }
        }
    </script>
</body>
</html>
